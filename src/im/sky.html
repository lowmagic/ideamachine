<script>
"use strict";

const S = D.stars.map(([id, x, y, size, conv, age, title, facts, first, times]) => {

const byId = new Map(S.map(s => [s.id, s]));

const c = document.getElementById("c"), g = c.getContext("2d");

      spike.addColorStop(0, `hsla(${color}, 70%, 85%, 0)`);

// `focus` bounds which stars belong (a constellation fanned out from a star, a stored lens, a lit set, or a seed's
// relevance), and `backdrop` chooses between isolating those stars (false) and dimming the rest of the sky (true).
const DAYS = [...new Set(S.flatMap(s => s.days))].sort();

  const [lo, hi] = slice.from && slice.to && slice.from > slice.to ? [slice.to, slice.from] : [slice.from, slice.to];
  return s.days.some(d => (!lo || d >= lo) && (!hi || d <= hi));

const HAZE = 160, haze = document.createElement("canvas"), hz = {x: 0, y: 0, w: 1, h: 1};

  const span = Math.max(Math.max(...xs) - x0, Math.max(...ys) - y0, .05), pad = span * .3;

const HOP = 240, HOPS = 4, still = matchMedia("(prefers-reduced-motion: reduce)");

const KNOCK = 10, LOSS = .68, SPRING = 260, DAMP = 150;

// `pool` keeps a tap's pulse inside an active constellation or lens so clicking around never spills out of it.

  }
  const labelled = group
    ? S.filter(s => group.has(s.i) && s.first <= cut).sort((a, b) => (b === rootStar) - (a === rootStar) || b.rel - a.rel || b.next.length - a.next.length).slice(0, 14)
    : [];
  if (selected && drawn >= 1) for (const j of selected.next) {
    if ((!group || group.has(j)) && inSlice(S[j]) && S[j].first <= cut && !labelled.includes(S[j]) && labelled.length < (group ? 18 : NAMED))
      labelled.push(S[j]);
  }
  if (selected && !labelled.includes(selected)) labelled.push(selected);
  if (lit) {
    g.strokeStyle = "rgba(255, 255, 255, .7)"; g.lineWidth = 1; g.beginPath(); g.arc(sx(lit), sy(lit), 11, 0, 6.283); g.stroke();
    g.strokeStyle = "rgba(255, 255, 255, .16)"; g.beginPath(); g.arc(sx(lit), sy(lit), AGAIN, 0, 6.283); g.stroke();
    if (!labelled.includes(lit)) labelled.push(lit);
  }
  g.font = "12px system-ui, sans-serif"; g.textBaseline = "middle";
  for (const s of labelled) {
    const t = s.title.length > 42 ? s.title.slice(0, 40) + "…" : s.title;
    g.fillStyle = s === selected ? "#ffffff" : "rgba(232, 234, 242, .82)";
    g.fillText(t, sx(s) + (s === lit ? 15 : 8), sy(s));
  }
}

function frame(now) {
  queued = false;
  if (replay && replay.playing) {
    replay.t = Math.min(T1, replay.t + (now - replay.last) / SWEEP * (T1 - T0)); replay.last = now;
    if (replay.t >= T1) playing(false);
    told(); dirty = true;
  }
  if (dirty || ripple || now - last >= 33) { dirty = false; last = now; draw(now); }
  if (ripple || replay && replay.playing || !still.matches && !document.hidden) { queued = true; requestAnimationFrame(frame); }
}
const redraw = () => { dirty = true; if (!queued) { queued = true; requestAnimationFrame(frame); } };
document.addEventListener("visibilitychange", redraw);

function resize() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; redraw();
}

function zoom(factor, px, py) {
  const wx = (px - W / 2) / cam.k + cam.x, wy = (py - H / 2) / cam.k + cam.y;
  cam.k = Math.max(20, Math.min(cam.k * factor, 200000));
  cam.x = wx - (px - W / 2) / cam.k; cam.y = wy - (py - H / 2) / cam.k; redraw();
}

function urlFor() {
  const p = new URLSearchParams();
  if (focus) {
    if (focus.kind === "constellation") {
      p.set("constellation", focus.root);
      if (focus.hops !== HOPS) p.set("hops", String(focus.hops));
    } else if (focus.kind === "seed") p.set("seed", focus.id);
    else if (focus.kind === "lens") p.set("lens", focus.id);
    else if (focus.kind === "lit") p.set("lit", focus.ids);
    const defaultBackdrop = focus.kind === "seed";
    if (backdrop !== defaultBackdrop) p.set("backdrop", backdrop ? "1" : "0");
  }
  if (slice) {
    if (slice.from) p.set("from", slice.from);
    if (slice.to) p.set("to", slice.to);
  }
  const q = p.toString();
  return q ? "/sky?" + q : "/sky";
}

function updateBar() {
  const bar = document.getElementById("bar");
  bar.style.display = selected ? "block" : "none";
  if (!selected) return;
  document.getElementById("t").textContent = selected.title;
  document.getElementById("f").textContent = selected.facts;
  document.getElementById("open").href = "/idea/" + selected.id;
  document.getElementById("crossroads").href = "/crossroads/" + selected.id;
  document.getElementById("lens").href = "/sky?seed=" + selected.id;
  const con = document.getElementById("constellation");
  con.href = "/sky?constellation=" + selected.id;
  con.textContent = focus && (focus.kind !== "constellation" || focus.root !== selected.id)
    ? "Constellation from here" : "Constellation";
}

function select(s, tapped) {
  selected = s && inSlice(s) && (!group || group.has(s.i)) ? s : null;
  near = selected ? reach(selected, HOPS, group) : null;
  if (selected && tapped) pluck(selected);
  updateBar();
  redraw();
}

function tap(s) {
  if (s && s !== lit) { lit = s; redraw(); }
  else if (s) { lit = null; select(s, true); }
  else if (lit) { lit = null; redraw(); }
  else select(null);
}

const AGAIN = 36;
const again = (px, py) => lit && Math.hypot(sx(lit) - px, sy(lit) - py) <= AGAIN ? lit : null;

function hit(px, py) {
  let best = null, bestD = Infinity;
  for (const s of S) {
    if (!inSlice(s) || group && !group.has(s.i) || replay && s.first > replay.t) continue;
    const d = Math.hypot(sx(s) - px, sy(s) - py);
    if (d < bestD) { best = s; bestD = d; }
  }
  return bestD <= 18 ? best : null;
}

// Recompute which stars belong to the active constellation/lens and time slice, update the nav controls, and redraw
// the haze. When `reframe` is true, fit the camera to the bounded stars.
function syncView(reframe) {
  for (const s of S) s.rel = 1;
  if (!focus) {
    group = null;
  } else if (focus.kind === "constellation") {
    const root = byId.get(focus.root);
    group = root && inSlice(root) ? new Set(reach(root, focus.hops, null).depth.keys()) : new Set();
  } else {
    for (const s of S) s.rel = focus.rel[s.id] || 0;
    group = new Set(S.filter(s => s.rel > 0 && inSlice(s)).map(s => s.i));
  }
  if (lit && (!inSlice(lit) || group && !group.has(lit.i))) lit = null;
  if (selected && (!inSlice(selected) || group && !group.has(selected.i))) selected = null;
  near = selected ? reach(selected, HOPS, group) : null;

  const scope = document.getElementById("scope"), backBtn = document.getElementById("backdrop");
  scope.hidden = !focus; backBtn.hidden = !focus;
  document.getElementById("home").hidden = !focus;
  backBtn.setAttribute("aria-pressed", backdrop);
  if (focus) {
    const label = focus.kind === "constellation" ? (byId.get(focus.root)?.title || "Constellation")
      : focus.kind === "lens" ? focus.name
      : focus.kind === "seed" ? (byId.get(focus.id)?.title || "Seed") : "Lit cards";
    document.getElementById("scopeName").textContent = label;
    document.getElementById("scopeCount").textContent = `${group.size} card${group.size === 1 ? "" : "s"}`;
    const hops = document.getElementById("hops");
    hops.hidden = focus.kind !== "constellation";
    for (const b of hops.querySelectorAll("button")) b.setAttribute("aria-pressed", Number(b.dataset.h) === focus.hops);
  }
  if (slice) {
    const n = S.filter(s => inSlice(s) && (!group || group.has(s.i))).length;
    document.getElementById("sliceCount").textContent = `${n} card${n === 1 ? "" : "s"}`;
  }
  mist();
  if (reframe) {
    const pool = group ? S.filter(s => group.has(s.i) && (focus.kind !== "seed" || s.rel >= .25))
      : S.filter(inSlice);
    fit(pool.length >= 2 ? pool : group && group.size === 1 ? S.filter(s => group.has(s.i)) : S);
  }
  updateBar();
  redraw();
}

// Replay: the archive as it grew.
const said = S.map(s => s.first).filter(t => t != null).sort((a, b) => a - b);
const T0 = said.length ? said[0] : 0, T1 = said.length ? said[said.length - 1] : 1, SWEEP = 45000;
let replay = null;
const fmtDay = new Intl.DateTimeFormat(undefined, {day: "numeric", month: "short", year: "numeric"});
function told() {
  let n = 0; while (n < said.length && said[n] <= replay.t) n++;
  document.getElementById("day").textContent = `${fmtDay.format(replay.t * 1000)} · ${n + S.length - said.length} cards`;
  document.getElementById("at").value = Math.round(1000 * (replay.t - T0) / Math.max(T1 - T0, 1));
}
function playing(on) {
  if (on && replay.t >= T1) replay.t = T0;
  replay.playing = on; replay.last = performance.now(); document.getElementById("go").textContent = on ? "Pause" : "Play";
  redraw();
}
function stopReplay() {
  if (!replay) return;
  replay = null;
  document.getElementById("replay").setAttribute("aria-pressed", "false");
  document.getElementById("time").hidden = true;
  document.body.classList.remove("replaying");
}
document.getElementById("replay").addEventListener("click", () => {
  if (replay) { stopReplay(); redraw(); return; }
  if (slice) setSlice(null);
  replay = {t: T0, playing: false, last: 0};
  document.getElementById("replay").setAttribute("aria-pressed", "true");
  document.getElementById("time").hidden = false;
  document.body.classList.add("replaying");
  lit = null; select(null); playing(true); told();
});
document.getElementById("go").addEventListener("click", () => playing(!replay.playing));
document.getElementById("at").addEventListener("input", e => {
  replay.t = T0 + (T1 - T0) * e.target.value / 1000; replay.playing = false;
  document.getElementById("go").textContent = "Play"; told(); redraw();
});

// Time slice: inclusive [from, to] dates, with date inputs and a dual-handle range slider over DAYS.
const fromEl = document.getElementById("from"), toEl = document.getElementById("to");
const r0 = document.getElementById("r0"), r1 = document.getElementById("r1");
r0.max = r1.max = String(Math.max(DAYS.length - 1, 0));
fromEl.min = toEl.min = DAY0; fromEl.max = toEl.max = DAY1;

function dayIndex(d, end) {
  if (!DAYS.length || !d) return end ? Math.max(DAYS.length - 1, 0) : 0;
  if (end) {
    let i = DAYS.length - 1; while (i > 0 && DAYS[i] > d) i--;
    return i;
  }
  let i = 0; while (i + 1 < DAYS.length && DAYS[i] < d) i++;
  return i;
}
function syncSliceControls() {
  const on = !!slice;
  document.getElementById("sliceBtn").setAttribute("aria-pressed", on);
  document.getElementById("slice").hidden = !on;
  document.body.classList.toggle("slicing", on);
  if (!on) return;
  fromEl.value = slice.from; toEl.value = slice.to;
  r0.value = String(dayIndex(slice.from, false));
  r1.value = String(dayIndex(slice.to, true));
}
function setSlice(next, reframe = false, replace = true) {
  if (next) stopReplay();
  slice = next;
  syncSliceControls();
  syncView(reframe);
  if (replace) history.replaceState(history.state, "", urlFor());
}
document.getElementById("sliceBtn").addEventListener("click", () => {
  setSlice(slice ? null : {from: DAY0, to: DAY1});
});
document.getElementById("clearSlice").addEventListener("click", () => setSlice(null));
document.getElementById("fitSlice").addEventListener("click", () => syncView(true));
for (const el of [fromEl, toEl]) el.addEventListener("input", () => {
  if (!slice) return;
  slice = {from: fromEl.value, to: toEl.value};
  r0.value = String(dayIndex(slice.from, false));
  r1.value = String(dayIndex(slice.to, true));
  syncView(false);
  history.replaceState(history.state, "", urlFor());
});
for (const [el, which] of [[r0, 0], [r1, 1]]) el.addEventListener("input", () => {
  if (!slice || !DAYS.length) return;
  let a = Number(r0.value), b = Number(r1.value);
  if (which === 0 && a > b) { b = a; r1.value = String(b); }
  if (which === 1 && b < a) { a = b; r0.value = String(a); }
  slice = {from: DAYS[a], to: DAYS[b]};
  fromEl.value = slice.from; toEl.value = slice.to;
  syncView(false);
  history.replaceState(history.state, "", urlFor());
});

// Constellation, lens and seed navigation.
function openConstellation(starId, hops = HOPS, push = true) {
  if (!byId.has(starId)) return;
  focus = {kind: "constellation", root: starId, hops};
  backdrop = false;
  document.title = byId.get(starId).title || "Sky";
  syncView(true);
  select(byId.get(starId), false);
  if (push) history.pushState({focus, backdrop, slice}, "", urlFor());
}
async function light(seed, push) {
  if (seed) {
    const r = await fetch("/sky/lens?seed=" + encodeURIComponent(seed), {credentials: "same-origin"});
    if (!r.ok) { location.href = "/sky?seed=" + encodeURIComponent(seed); return; }
    const got = await r.json();
    focus = {kind: "seed", id: seed, rel: got.rel};
    backdrop = true;
    document.title = got.title;
  } else {
    focus = null; backdrop = false; document.title = "Sky";
  }
  syncView(true);
  select(seed ? byId.get(seed) || null : null, false);
  if (push) history.pushState({focus, backdrop, slice}, "", urlFor());
}

document.getElementById("constellation").addEventListener("click", e => {
  if (!selected || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); openConstellation(selected.id, HOPS, true);
});
document.getElementById("lens").addEventListener("click", e => {
  if (!selected || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); light(selected.id, true);
});
document.getElementById("home").addEventListener("click", e => {
  if (e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); light(null, true);
});
document.getElementById("backdrop").addEventListener("click", () => {
  backdrop = !backdrop;
  syncView(false);
  history.replaceState({focus, backdrop, slice}, "", urlFor());
});
document.getElementById("hops").addEventListener("click", e => {
  const b = e.target.closest("button[data-h]");
  if (!b || !focus || focus.kind !== "constellation") return;
  focus = {...focus, hops: Number(b.dataset.h)};
  syncView(true);
  history.replaceState({focus, backdrop, slice}, "", urlFor());
});

const pointers = new Map();
let down = null, pinch = null;
c.addEventListener("pointerdown", e => {
  c.setPointerCapture(e.pointerId); pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  down = pointers.size === 1 ? {x: e.clientX, y: e.clientY, t: Date.now(), moved: false} : null;
  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    pinch = Math.hypot(p.x - q.x, p.y - q.y);
  }
});
c.addEventListener("pointermove", e => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const now = {x: e.clientX, y: e.clientY};
  pointers.set(e.pointerId, now);
  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    const d = Math.hypot(p.x - q.x, p.y - q.y);
    if (pinch) zoom(d / pinch, (p.x + q.x) / 2, (p.y + q.y) / 2);
    pinch = d;
  } else if (pointers.size === 1) {
    cam.x -= (now.x - prev.x) / cam.k; cam.y -= (now.y - prev.y) / cam.k;
    if (down && Math.hypot(now.x - down.x, now.y - down.y) > 6) down.moved = true;
    redraw();
  }
});
const up = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (down && !down.moved && Date.now() - down.t < 500 && e.type === "pointerup") tap(again(e.clientX, e.clientY) || hit(e.clientX, e.clientY));
  down = null;
};
c.addEventListener("pointerup", up);
c.addEventListener("pointercancel", up);
c.addEventListener("wheel", e => { e.preventDefault(); zoom(Math.exp(-e.deltaY / 400), e.clientX, e.clientY); },
                   {passive: false});
addEventListener("resize", resize);

function bootFromUrl() {
  const qs = new URLSearchParams(location.search);
  const validDate = d => d && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : "";
  const f = validDate(qs.get("from")), u = validDate(qs.get("to"));
  slice = f || u ? {from: f, to: u} : null;
  syncSliceControls();

  const askedLit = qs.get("lit"), con = qs.get("constellation") || D.constellation;
  const hops = Math.max(1, Math.min(HOPS, Number(qs.get("hops")) || HOPS));
  if (con && byId.has(con)) {
    focus = {kind: "constellation", root: con, hops};
    backdrop = qs.get("backdrop") === "1";
  } else if (D.lens && D.rel) {
    focus = {kind: "lens", id: D.lens.id, name: D.lens.name, rel: D.rel};
    backdrop = qs.get("backdrop") === "1";
  } else if (D.seed && D.rel) {
    focus = {kind: "seed", id: D.seed, rel: D.rel};
    backdrop = qs.get("backdrop") !== "0";
  } else if (askedLit) {
    const rel = Object.fromEntries(askedLit.split(",").filter(Boolean).map(id => [id, 1]));
    focus = {kind: "lit", ids: askedLit, rel};
    backdrop = qs.get("backdrop") === "1";
  } else {
    focus = null; backdrop = false;
  }
  syncView(true);
  const pickId = focus?.kind === "constellation" ? focus.root : focus?.kind === "seed" ? focus.id : null;
  select(pickId ? byId.get(pickId) || null : null, false);
}

addEventListener("popstate", e => {
  if (e.state && "focus" in e.state) {
    focus = e.state.focus; backdrop = e.state.backdrop; slice = e.state.slice;
    syncSliceControls(); syncView(true);
    const pickId = focus?.kind === "constellation" ? focus.root : focus?.kind === "seed" ? focus.id : null;
    select(pickId ? byId.get(pickId) || null : null, false);
  } else {
    bootFromUrl();
  }
});

resize();
bootFromUrl();
history.replaceState({focus, backdrop, slice}, "", urlFor());
redraw();
</script>
</html>
